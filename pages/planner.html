<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Planner | Student Study Hub</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="../css/style.css"><style>
.page{max-width:1100px;margin:auto;padding:28px 20px 55px}.hero{min-height:0!important;display:block!important;grid-template-columns:none!important;text-align:center;padding:24px 20px 22px!important;gap:0!important}.kick{color:#6ab9ff;font-size:12px;letter-spacing:2.5px;font-weight:800}.hero h1{font:800 clamp(38px,5vw,60px) Poppins;margin:6px 0}.hero h1 span{color:#6fa8ff}.hero p{color:#bdc9da;margin:6px 0 0}.glass{background:rgba(5,15,30,.72);border:1px solid rgba(255,255,255,.15);border-radius:22px;backdrop-filter:blur(16px);box-shadow:0 20px 55px rgba(0,0,0,.18)}.card{padding:25px}.form{display:grid;grid-template-columns:1.6fr 1fr 1fr auto;gap:10px}.form input,.form select{width:100%;box-sizing:border-box;padding:13px;border-radius:11px;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.07);color:white;outline:0}.form select option{color:#111}.primary{border:0;border-radius:11px;padding:12px 17px;background:linear-gradient(100deg,#1596ff,#7438ff);color:white;font-weight:800;cursor:pointer}.danger{border:1px solid rgba(255,100,120,.3);border-radius:10px;padding:8px 12px;background:rgba(255,80,100,.1);color:#ffb4c0;font-weight:700;cursor:pointer}.task{display:flex;align-items:center;gap:13px;padding:16px 0;border-bottom:1px solid rgba(255,255,255,.08)}.task input{width:18px;height:18px;accent-color:#318eff}.main{flex:1}.name{font-weight:800}.meta{font-size:12px;color:#91a4bb;margin-top:5px}.summary{color:#91a4bb;font-size:13px}.empty{text-align:center;color:#91a4bb;padding:35px}.toast{position:fixed;right:25px;bottom:25px;background:#13243a;color:white;border:1px solid rgba(255,255,255,.16);padding:14px 18px;border-radius:12px;display:none;z-index:50}@media(max-width:750px){.form{grid-template-columns:1fr}.page{padding:35px 15px 60px}}
</style></head><body><div class="site-bg"></div><div class="bg-overlay"></div><header class="navbar"><a class="brand" href="../index.html"><span class="brand-icon">🎓</span><span>Student <strong>Study Hub</strong></span></a><nav class="nav-links" id="siteNav"><a href="dashboard.html">Dashboard</a><a href="materials.html">Materials</a><a href="quiz.html">Quiz</a><a class="active" href="planner.html">Planner</a><a href="profile.html">Profile</a></nav><div class="nav-actions"><button class="outline-btn" onclick="logoutStudent()">Logout</button><button class="menu-btn" id="menuBtn">☰</button></div></header><main class="page planner-page"><section class="hero"><div class="kick">ORGANIZE YOUR DAY</div><h1>Study <span>Planner</span></h1><p>Create tasks, set deadlines and track completion.</p></section><section class="glass card"><form id="taskForm" class="form"><input id="taskName" required autocomplete="off" placeholder="What do you need to study?"><input id="taskDate" required type="date"><select id="taskPriority"><option>High</option><option selected>Medium</option><option>Low</option></select><button class="primary" type="submit">+ Add Task</button></form></section><section class="glass card" style="margin-top:20px"><div style="display:flex;justify-content:space-between;gap:10px"><h2 style="font-family:Poppins;margin:0">Your Tasks</h2><span id="summary" class="summary"></span></div><div id="tasks"></div></section></main><div id="toast" class="toast"></div><script src="../js/auth-guard.js"></script><script>
const student=requireStudentLogin();if(student)updateStudentName();const mb=document.getElementById("menuBtn"),nv=document.getElementById("siteNav");if(mb)mb.onclick=()=>nv.classList.toggle("open");
const form=document.getElementById("taskForm"),nameEl=document.getElementById("taskName"),dateEl=document.getElementById("taskDate"),priorityEl=document.getElementById("taskPriority"),tasksEl=document.getElementById("tasks"),summary=document.getElementById("summary"),toast=document.getElementById("toast");const key=student?"sshTasks_"+student.id:"sshTasks_guest";let tasks=[];try{tasks=JSON.parse(localStorage.getItem(key)||"[]");if(!Array.isArray(tasks))tasks=[]}catch(e){tasks=[]}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}function save(){localStorage.setItem(key,JSON.stringify(tasks));render()}function msg(t){toast.textContent=t;toast.style.display="block";setTimeout(()=>toast.style.display="none",1600)}
function render(){const done=tasks.filter(t=>t.done).length;summary.textContent=`${tasks.length} total • ${tasks.length-done} pending • ${done} completed`;if(!tasks.length){tasksEl.innerHTML='<div class="empty">📅<br><br>No tasks yet. Add your first study task above.</div>';return}tasksEl.innerHTML=tasks.map((t,i)=>`<div class="task"><input type="checkbox" class="toggle" data-i="${i}" ${t.done?"checked":""}><div class="main"><div class="name" style="${t.done?"text-decoration:line-through;color:#718198":""}">${esc(t.name)}</div><div class="meta">Deadline: ${esc(t.date)} • ${esc(t.priority)}</div></div><button class="danger" data-del="${i}">Delete</button></div>`).join("");document.querySelectorAll(".toggle").forEach(x=>x.onchange=()=>{tasks[+x.dataset.i].done=x.checked;save()});document.querySelectorAll("[data-del]").forEach(x=>x.onclick=()=>{tasks.splice(+x.dataset.del,1);save();msg("Task deleted")})}
form.onsubmit=e=>{e.preventDefault();const n=nameEl.value.trim(),d=dateEl.value;if(!n||!d){msg("Enter a task and deadline.");return}tasks.push({id:Date.now(),name:n,date:d,priority:priorityEl.value,done:false});save();form.reset();msg("Task added successfully ✓")};render();
</script>
<style>

  min-height: 0 !important;
  height: auto !important;
  max-height: none !important;
  padding: 18px 20px 16px !important;
  margin: 0 auto 12px !important;
  display: block !important;
  grid-template-columns: none !important;
  align-items: initial !important;
  gap: 0 !important;
}
.planner-page .hero h1 { margin: 4px 0 4px !important; line-height: 1.08 !important; }
.planner-page .hero p { margin: 0 !important; line-height: 1.45 !important; }
.planner-page .page, .planner-page { padding-top: 18px !important; }
</style>
</body></html>
