<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Login | Student Study Hub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <style>
    .auth-page{min-height:100vh;display:grid;place-items:center;padding:35px 18px}
    .login-box{width:min(470px,100%);padding:42px;background:rgba(5,15,30,.80);border:1px solid rgba(255,255,255,.18);border-radius:26px;backdrop-filter:blur(18px);box-shadow:0 30px 90px rgba(0,0,0,.35)}
    .login-brand{display:flex;justify-content:center;margin-bottom:25px}
    .login-box h1{font-family:Poppins,sans-serif;text-align:center;font-size:32px;margin-bottom:8px}
    .login-box .sub{text-align:center;color:#aebbd0;margin-bottom:28px}
    .field{margin-bottom:16px}.field label{display:block;color:#dce6f4;font-size:13px;font-weight:700;margin-bottom:7px}
    .field input{width:100%;padding:14px;border-radius:11px;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.07);color:white;outline:none}
    .password-wrap{position:relative}.password-wrap input{padding-right:50px}
    .show-pass{position:absolute;right:8px;top:7px;border:0;background:transparent;color:#b8c6d9;padding:7px}
    .login-submit{width:100%;padding:14px;border:0;border-radius:12px;color:white;font-weight:800;background:linear-gradient(100deg,#1596ff,#7438ff);box-shadow:0 12px 30px rgba(72,76,255,.25)}
    .auth-message{min-height:22px;margin-top:13px;font-size:13px;font-weight:700}.success{color:#6ee7b7}.error{color:#fda4af}
    .login-links{display:flex;justify-content:space-between;margin-top:18px;font-size:13px}.login-links a{color:#68b5ff;text-decoration:none}
    .register-box{margin-top:25px;padding-top:20px;border-top:1px solid rgba(255,255,255,.12);text-align:center;color:#aebbd0;font-size:13px}
    .register-box a{color:#68b5ff;text-decoration:none;font-weight:700}
    .back-home{position:fixed;top:20px;left:20px;color:white;text-decoration:none;font-weight:700}
  </style>
</head>
<body>
  <div class="site-bg"></div>
  <div class="bg-overlay"></div>

  <a class="back-home" href="../index.html">← Home</a>

  <main class="auth-page">
    <section class="login-box">
      <div class="login-brand">
        <a class="brand" href="../index.html">
          <span class="brand-icon">🎓</span>
          <span>Student <strong>Study Hub</strong></span>
        </a>
      </div>

      <h1>Welcome Back</h1>
      <p class="sub">Login to continue your learning journey.</p>

      <form id="loginForm">
        <div class="field">
          <label for="loginEmail">Email Address</label>
          <input id="loginEmail" type="email" placeholder="you@example.com" required>
        </div>

        <div class="field">
          <label for="loginPassword">Password</label>
          <div class="password-wrap">
            <input id="loginPassword" type="password" placeholder="Enter your password" required>
            <button class="show-pass" type="button" data-target="loginPassword">👁</button>
          </div>
        </div>

        <label class="remember-row">
          <input id="rememberMe" type="checkbox" checked>
          <span>Remember me on this device</span>
        </label>

        <button class="login-submit" type="submit">Login to Student Hub →</button>
        <div id="loginMessage" class="auth-message"></div>
      </form>

      <div class="login-links">
        <a href="#" onclick="alert('Password reset will be connected to the backend in the next authentication step.');return false;">Forgot password?</a>
        <a href="register.html">Create account</a>
      </div>

      <div style="text-align:center;margin-top:16px;font-size:12px"><a href="admin-login.html" style="color:#a78bfa;text-decoration:none;font-weight:700">⚙ Admin Login</a></div>

      <div class="register-box">
        New student? <a href="register.html">Register for free</a>
      </div>
    </section>
  </main>

  <script src="../js/auth.js"></script>

<script>
(function(){
  try {
    const saved = localStorage.getItem("sshCurrentStudent") || sessionStorage.getItem("sshCurrentStudent");
    if (saved) window.location.replace("dashboard.html");
  } catch(e) {}
})();
</script>
</body>
</html>
