<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Unit Notes | Student Study Hub</title><link rel="stylesheet" href="../css/style.css"><style>.wrap{max-width:1000px;margin:auto;padding:55px 20px 80px}.panel{background:rgba(5,15,30,.78);border:1px solid rgba(255,255,255,.14);border-radius:22px;padding:28px}.muted{color:#9eb0c4;line-height:1.7}.unit{padding:20px;border:1px solid rgba(255,255,255,.1);border-radius:16px;background:rgba(255,255,255,.04);margin-top:15px}.btn{display:inline-block;margin:8px 7px 0 0;padding:10px 13px;border-radius:10px;background:linear-gradient(100deg,#1596ff,#7438ff);color:#fff;text-decoration:none;font-weight:800;font-size:12px}.source{padding:14px;margin-top:12px;border-radius:12px;background:rgba(255,255,255,.04)}.back-btn{display:inline-flex;align-items:center;gap:8px;margin-bottom:14px;padding:10px 15px;border-radius:10px;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.06);color:#fff;text-decoration:none;font-weight:800;font-size:13px;transition:.2s}.back-btn:hover{background:rgba(255,255,255,.12);transform:translateX(-2px)}</style></head><body><div class="site-bg"></div><div class="bg-overlay"></div><header class="navbar"><a class="brand" href="../index.html"><span class="brand-icon">🎓</span><span>Student <strong>Study Hub</strong></span></a><nav class="nav-links"><a href="dashboard.html">Dashboard</a><a class="active" href="materials.html">Materials</a><a href="quiz.html">Quiz</a><a href="planner.html">Planner</a><a href="profile.html">Profile</a></nav><div class="nav-actions"><button class="outline-btn" onclick="logoutStudent()">Logout</button></div></header><main class="wrap"><a class="back-btn" href="materials.html">← Back to Materials</a><div class="panel"><div class="kick" style="color:#6ab9ff;font-size:12px;letter-spacing:2px;font-weight:800">UNIT REVISION</div><h1 id="title" style="font-family:Poppins"></h1><p id="intro" class="muted"></p><div id="unit"></div><div id="sources"></div></div></main><script src="../js/auth-guard.js"></script><script src="../js/sitams-r23-aiml.js"></script><script src="../js/content-data.js"></script><script>const s=requireStudentLogin();if(s)updateStudentName();const p=new URLSearchParams(location.search),name=p.get('subject')||'',uid=Number(p.get('unit')||1),d=(window.STUDY_CONTENT||[]).find(x=>x.name===name)||STUDY_CONTENT[0],u=d.units.find(x=>x.id===uid)||d.units[0];document.getElementById('title').textContent=d.icon+' '+d.name+' • Unit '+u.id;document.getElementById('intro').textContent='Original concise revision notes aligned to the course topic structure. Use the linked resources for deeper study.';const pdfPath=d.pdf||''; const pdfButton=pdfPath?'<a class="btn" href="'+pdfPath+'" target="_blank" rel="noopener">📄 Open Professional PDF Guide</a>':''; const progressKey='sshQuizProgress_'+s.id+'_'+d.name+'|Unit '+u.id; const saved=localStorage.getItem(progressKey); const prog=saved?JSON.parse(saved):null; const progressHtml=prog?'<div style="margin-top:16px;padding:14px;border-radius:12px;background:rgba(70,180,120,.08);border:1px solid rgba(70,180,120,.2)"><b>Latest quiz score:</b> '+prog.score+' / '+prog.total+' ('+Math.round(prog.score/prog.total*100)+'%)</div>':'<div style="margin-top:16px;padding:14px;border-radius:12px;background:rgba(255,255,255,.04)"><b>Progress:</b> Quiz not attempted yet.</div>'; document.getElementById('unit').innerHTML=progressHtml+'<div class="unit"><h2 style="font-family:Poppins">'+u.title+'</h2>'+u.summary.map(x=>'<p class="muted">• '+x+'</p>').join('')+(u.topics?'<h3 style="font-family:Poppins;margin-top:18px">SITAMS R23 syllabus topics</h3><p class="muted">'+u.topics+'</p>':'<p class="muted">Exact unit topics have not yet been source-mapped for this course.</p>')+''+pdfButton+'<a class="btn" href="quiz.html?code='+encodeURIComponent(d.code)+'&unit='+u.id+'">📝 Unit Quiz</a></div>';document.getElementById('sources').innerHTML=d.resources.length?'<h3 style="font-family:Poppins;margin-top:25px">Verified learning resources</h3>'+d.resources.map(r=>'<div class="source"><b>'+r[0]+'</b><p class="muted" style="font-size:13px">'+r[2]+'</p><a class="btn" href="'+r[1]+'" target="_blank" rel="noopener">Open resource ↗</a></div>').join(''):'<p class="muted" style="margin-top:22px">No external resource link has been added for this subject yet. The notes above are original revision material aligned to the mapped syllabus topics.</p>';</script></body></html>
