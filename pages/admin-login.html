<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Admin Login | Student Study Hub</title><link rel="stylesheet" href="../css/style.css"><style>
.admin-auth{min-height:100vh;display:grid;place-items:center;padding:25px}.admin-box{width:min(460px,100%);padding:38px;border-radius:24px;background:rgba(5,15,30,.82);border:1px solid rgba(255,255,255,.16);box-shadow:0 30px 90px rgba(0,0,0,.4);backdrop-filter:blur(18px)}.admin-badge{display:inline-flex;padding:7px 11px;border-radius:999px;background:rgba(116,56,255,.16);border:1px solid rgba(150,110,255,.25);color:#cdbdff;font-size:11px;font-weight:800;letter-spacing:1px}.admin-box h1{font-family:Poppins,sans-serif;margin:16px 0 8px;font-size:32px}.admin-box p{color:#aebbd0}.field{margin:18px 0}.field label{display:block;font-size:12px;font-weight:800;color:#dce6f4;margin-bottom:7px}.field input{width:100%;box-sizing:border-box;padding:13px;border-radius:11px;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.07);color:#fff;outline:none}.admin-submit{width:100%;padding:14px;border:0;border-radius:12px;color:#fff;font-weight:800;background:linear-gradient(100deg,#1596ff,#7438ff)}.msg{min-height:20px;margin-top:12px;font-size:13px;font-weight:700}.error{color:#fda4af}.hint{margin-top:18px;padding:12px;border-radius:12px;background:rgba(255,255,255,.05);color:#93a6bf;font-size:12px;line-height:1.6}.back{display:inline-block;margin-top:18px;color:#68b5ff;text-decoration:none;font-size:13px}
</style></head><body><div class="site-bg"></div><div class="bg-overlay"></div><main class="admin-auth"><section class="admin-box"><span class="admin-badge">ADMIN CONTROL CENTER</span><h1>Admin Login</h1><p>Manage the local Student Study Hub prototype from one dashboard.</p><form id="adminLoginForm"><div class="field"><label>Email</label><input id="adminEmail" type="email" required placeholder="admin@sitams.local"></div><div class="field"><label>Password</label><input id="adminPassword" type="password" required placeholder="Enter admin password"></div><button class="admin-submit">Open Admin Dashboard →</button><div id="adminMsg" class="msg"></div></form><div class="hint"><b>Demo admin:</b> admin@sitams.local<br><b>Password:</b> Admin@123<br><span>This is a browser-only prototype. Admin data is stored in localStorage, not a real server.</span></div><a class="back" href="login.html">← Back to Student Login</a></section></main><script src="../js/admin.js"></script><script>(function(){if(getAdminSession())location.replace('admin.html');const f=document.getElementById('adminLoginForm');f.addEventListener('submit',function(e){e.preventDefault();const email=document.getElementById('adminEmail').value.trim().toLowerCase(),pw=document.getElementById('adminPassword').value,msg=document.getElementById('adminMsg');if(email===SSH_ADMIN.email&&pw===SSH_ADMIN.password){sessionStorage.setItem('sshAdminSession',JSON.stringify({email,role:'admin',name:'SITAMS Admin'}));msg.className='msg';msg.textContent='Login successful...';setTimeout(()=>location.href='admin.html',400)}else{msg.className='msg error';msg.textContent='Invalid admin credentials.'}})})();</script></body></html>
